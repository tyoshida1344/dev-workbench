<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dev-workbench</title>
  <link rel="stylesheet" href="_lib/style.css">
  <!-- 前の版から移る人のために、古いログインのしるしを移し、URLに残ったトークンを消す(drive.js が読み込まれた時に行う) -->
  <script type="module" src="_lib/drive.js"></script>
</head>
<body>
  <main class="home">
    <h1>dev-workbench</h1>
    <p class="muted">開発で使う道具の置き場。データは置かず、DriveなどにあるものをURLで指して開く。</p>
    <ul class="tools">
      <li>
        <a class="tool-name" href="design/">設計ビューア</a>
        <span class="muted">イシューごとの設計(Markdown)を、文書の一覧から読む。<code>?folder=&lt;DriveのフォルダID&gt;</code> を付けて開く</span>
        <span class="muted"><a href="design/?folder=sample">見本を開く</a>(Driveもログインも要らない)</span>
      </li>
      <li>
        <a class="tool-name" href="evidence/">エビデンスビューア</a>
        <span class="muted">テストケースと、受入確認の動画・画像を、項目の一覧から見て回る。<code>?folder=&lt;DriveのフォルダID&gt;</code> を付けて開く</span>
        <span class="muted"><a href="evidence/?folder=sample">見本を開く</a>(Driveもログインも要らない)</span>
      </li>
    </ul>
  </main>
</body>
</html>
