# GitHub Pages に公開する。ビルドはせず、app/ をサイトの直下に、sample/ を /sample/ に写して上げるだけ。
# 公開されるのは画面(app/)と見本(sample/)だけで、スキル・docs・scripts は公開しない。
# リポジトリの Settings → Pages の Source を「GitHub Actions」にしておく。
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は1つずつ行う。途中の公開は取り消さない(GitHub のひな形と同じ)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 版を決めておく(ES モジュールの .js を調べられない古い版だと、検査で止まって公開されない)。check.yml と同じ版にする
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 検査する
        run: node scripts/check.mjs

      - name: 公開するファイルを集める
        run: |
          mkdir _site
          cp -R app/. _site/
          cp -R sample _site/sample

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
